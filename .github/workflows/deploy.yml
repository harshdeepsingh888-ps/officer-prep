# Builds the app and publishes it to GitHub Pages on every push to main, and twice a day
# (07:00 and 19:00 IST) to refresh the current-affairs headlines.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 1,13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Unit and module tests: a failure stops the deploy, so a broken build never reaches the site.
      - run: npm test
      # Headlines: start from the copy already on the site so earlier days are kept, then add today's.
      # A failed fetch never stops the deploy; the page just shows the last good copy.
      - name: Fetch current-affairs headlines
        run: |
          mkdir -p public/news
          curl -sf "https://harshdeepsingh888-ps.github.io/officer-prep/news/latest.json" -o public/news/latest.json || true
          npm run news || true
      - run: npm run build
        env:
          # Optional: the Picker API key, if you add it under Settings → Secrets and variables → Actions → Variables.
          VITE_GOOGLE_API_KEY: ${{ vars.VITE_GOOGLE_API_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
