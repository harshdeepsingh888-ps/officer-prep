    <script>
      // Links to the app from before it moved under app/ (…/officer-prep/#/practice) open the app at the same page,
      // and an app installed before the move (its start page was this root) opens the app, not the landing page.
      (function () {
        var oldLink = location.hash.indexOf('#/') === 0
        var installed = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true
        if (oldLink || installed) location.replace('app/' + (oldLink ? location.hash : ''))
      })()
    </script>
